name: open-university-os

services:
  mysql:
    image: mysql:8.4
    environment:
      # The schema and grants already live in the mysql-data volume under these names; renaming them
      # would orphan the Flyway history, so the project rename does not touch the credentials.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-universiry_dev}
      MYSQL_USER: ${DB_USERNAME:-universiry_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:-universiry_dev_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Document store for structures that do not fit the relational model. Nothing reads it yet: the
  # backend owns no Mongo port and no repository, so adding it here provisions infrastructure without
  # creating a second source of truth for any domain.
  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-open_university_os_documents}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' \"$(echo $$MONGO_INITDB_DATABASE)\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      SPRING_PROFILES_ACTIVE: local-preview
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-universiry_dev}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: ${DB_USERNAME:-universiry_dev}
      DB_PASSWORD: ${DB_PASSWORD:-universiry_dev_local_only}
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DATABASE:-open_university_os_documents}
      BRANDING_ASSETS_DIRECTORY: /var/branding-assets
      ACADEMIC_CATALOG_IMPORT_MAX_FILE_BYTES: ${ACADEMIC_CATALOG_IMPORT_MAX_FILE_BYTES:-2097152}
      ACADEMIC_CATALOG_IMPORT_MAX_ROWS: ${ACADEMIC_CATALOG_IMPORT_MAX_ROWS:-10000}
      UPTC_OIDC_ISSUER_URI: ${UPTC_OIDC_ISSUER_URI:-}
      UPTC_OIDC_AUDIENCE: ${UPTC_OIDC_AUDIENCE:-}
      UPTC_OIDC_AUTHORITIES_CLAIM: ${UPTC_OIDC_AUTHORITIES_CLAIM:-authorities}
      UPTC_OIDC_ROLE_PERMISSION_MAPPING: ${UPTC_OIDC_ROLE_PERMISSION_MAPPING:-}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null --max-time 3 http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    # Medido el 5 de octubre de 2026: `depends_on: - backend` solo espera a que el contenedor
    # arranque, no a que Spring termine de migrar con Flyway. El frontend arrancaba y la primera
    # peticion a /api/v1/me fallaba con connection refused.
    volumes:
      - maven-cache:/root/.m2
      - branding-assets:/var/branding-assets
    develop:
      watch:
        - action: sync+restart
          path: ./backend/src
          target: /workspace/src
        - action: rebuild
          path: ./backend/pom.xml
        - action: rebuild
          path: ./backend/Dockerfile.dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_TARGET: http://backend:8080
      VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /workspace/src
        - action: sync
          path: ./frontend/public
          target: /workspace/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/vite.config.ts
        - action: rebuild
          path: ./frontend/index.html
        - action: rebuild
          path: ./frontend/Dockerfile.dev

volumes:
  mysql-data:
  mongodb-data:
  maven-cache:
  branding-assets: