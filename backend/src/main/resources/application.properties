spring.application.name=universiry-backend
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.error.include-message=never
# El valor por defecto de Spring Boot ya es never; se deja explicito para que una
# actualizacion de la dependencia o un ajuste futuro no expongan trazas al cliente.
# Protegido por ApiErrorExposureGuardTest.
server.error.include-stacktrace=never
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/universiry_dev?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:universiry_dev}
spring.datasource.password=${DB_PASSWORD:}

branding.assets.directory=${BRANDING_ASSETS_DIRECTORY:./.data/branding-assets}
branding.assets.max-bytes=${BRANDING_ASSETS_MAX_BYTES:5242880}
branding.assets.max-width=${BRANDING_ASSETS_MAX_WIDTH:8192}
branding.assets.max-height=${BRANDING_ASSETS_MAX_HEIGHT:8192}
branding.assets.max-pixels=${BRANDING_ASSETS_MAX_PIXELS:16777216}

spring.servlet.multipart.max-file-size=${BRANDING_ASSETS_MAX_BYTES:5MB}
spring.servlet.multipart.max-request-size=${BRANDING_ASSETS_MAX_REQUEST_BYTES:6MB}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# The OpenAPI description is generated from the running application. It stays unreachable for anonymous
# callers and outside the local preview profile, where the security chain denies every unmatched route.
springdoc.api-docs.path=/v3/api-docs
# The developer preview surface is not part of the institutional API contract, so it is never documented.
springdoc.paths-to-exclude=/api/v1/dev/**
