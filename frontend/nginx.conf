server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sin reescritura SPA: la aplicación navega por fragmento (#resumen, #programas, ...), que el
    # navegador nunca envía al servidor. Cada ruta profunda llega como `/` y sirve el index.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cabeceras seguras en cualquier origen. La CSP de la aplicación y la política de framing se
    # definen con el proxy de producción, no aquí: una política inventada rompería el flujo OIDC.
    # NOTA DE NGINX: `add_header` dentro de un `location` reemplaza TODAS las heredadas, no se suma.
    # Por eso las dos cabeceras de seguridad se repiten en cada bloque que declara las suyas; si no,
    # el documento principal (que cae en `location = /index.html`) las perdería en silencio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
